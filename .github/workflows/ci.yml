name: MoonODS checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  js:
    runs-on: ubuntu-latest
    env:
      MOONBIT_VERSION: 0.10.14+7d59c7ec9
      RUST_LOG: error
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.14
      - name: Prepare exact official SDK on the disposable runner
        env:
          MOON_HOME: ${{ runner.temp }}/moonods-sdk
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$RUNNER_TEMP/moonbit-install.sh"
          bash "$RUNNER_TEMP/moonbit-install.sh" "$MOONBIT_VERSION"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned packages and verifier
        run: |
          moon update
          moon check --target js -j 1 --deny-warn
          python -m pip install -r requirements-verify.txt
          python scripts/verify_deps.py
          python scripts/fetch_schemas.py
      - name: Serial check build test and independent verification
        run: python scripts/acceptance.py --output evidence/ci
      - name: Keep evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moonods-js-evidence
          path: |
            evidence/ci
            examples/generated/*.ods
