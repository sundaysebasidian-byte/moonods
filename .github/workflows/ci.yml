name: MoonODS checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backends:
    name: core tests on ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, native]
    env:
      MOONBIT_VERSION: 0.10.18+6c83a7f62
      RUST_LOG: error
      MOON_REGISTRY_API: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare exact official SDK on the disposable runner
        env:
          MOON_HOME: ${{ github.workspace }}/.toolchains/ci-sdk
        run: |
          python3 scripts/install-ci-sdk.py --dest "$MOON_HOME"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Restore pinned dependencies
        run: |
          python3 scripts/restore_deps.py
          moon update
      - name: Library and consumer tests
        run: moon test --target ${{ matrix.target }} -j 1 --no-parallelize --deny-warn . tests/consumer benchmarks
  js:
    runs-on: ubuntu-24.04
    env:
      MOONBIT_VERSION: 0.10.18+6c83a7f62
      RUST_LOG: error
      MOON_REGISTRY_API: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.14
      - name: Prepare exact official SDK on the disposable runner
        env:
          MOON_HOME: ${{ github.workspace }}/.toolchains/ci-sdk
        run: |
          python3 scripts/install-ci-sdk.py --dest "$MOON_HOME"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - name: Offline SDK bootstrap guards
        run: python3 -m unittest discover -s scripts -p 'test_install_ci_sdk.py'
      - name: Resolve pinned packages and verifier
        run: |
          python scripts/restore_deps.py
          moon update
          # acceptance.py runs moon check after validating the pristine dependency lock.
          # A prior check regenerates dependency interfaces and invalidates that check.
          python -m pip install -r requirements-verify.txt
          python scripts/verify_deps.py
          python scripts/fetch_schemas.py
      - name: Serial JS and Wasm GC tests and independent verification
        run: python scripts/acceptance.py --output evidence/ci
      # Evidence is printed in logs; no automatic artifact storage upload.
