# Mirrors what a reviewer does after `git clone`: install the official SDK,
# then plain `moon check` / `moon test` and the README quick start.
name: Fresh clone quick start
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  quickstart:
    name: moon ${{ matrix.sdk }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sdk: [pinned]
    env:
      MOON_REGISTRY_API: "1"
      PINNED_SDK: 0.10.18+6c83a7f62
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
      - name: Install locked project-local SDK
        env:
          MOON_HOME: ${{ github.workspace }}/.toolchains/fresh-sdk
        run: |
          python3 scripts/install-ci-sdk.py --dest "$MOON_HOME"
          echo "MOON_HOME=$MOON_HOME" >> "$GITHUB_ENV"
          echo "$MOON_HOME/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: python3 scripts/restore_deps.py
      # Resolve the existing dependency lock; do not change dependency versions.
      - run: moon update
      - run: moon check
      - run: moon test
      - name: README quick start
        run: |
          moon run examples/generate --target js
          ls -l examples/generated/*.ods
          moon run examples/compatibility --target js
          ODS_INPUT=tests/reader-fixtures/external/libreoffice-dev-types.ods ODS_ACCEPT_LOSS=1 \
            moon run examples/ods_tool --target js
      - name: Current-source procurement workflow
        run: python3 scripts/verify_reconcile_source.py --output "$RUNNER_TEMP/reconcile-${{ matrix.sdk }}"
      - name: Formatting and generated interfaces are up to date
        if: matrix.sdk == 'pinned'
        run: |
          moon fmt --check
          moon info
          git diff --exit-code -- '*.mbti'
